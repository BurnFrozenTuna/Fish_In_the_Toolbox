const WEBP_TARGET = 5000000;
function webpChunks(bytes) {
 const text=(p,n)=>String.fromCharCode(...bytes.subarray(p,p+n));
 const view=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
 if(bytes.length<12||text(0,4)!=='RIFF'||text(8,4)!=='WEBP'||view.getUint32(4,true)+8!==bytes.length)throw Error('invalid');
 const result=[];let p=12;
 while(p<bytes.length){
  if(p+8>bytes.length)throw Error('invalid');
  const size=view.getUint32(p+4,true),end=p+8+size+(size%2);
  if(end>bytes.length)throw Error('invalid');
  result.push({name:text(p,4),data:bytes.subarray(p+8,p+8+size),raw:bytes.subarray(p,end)});p=end;
 }
 return result;
}
const read24=(b,p)=>b[p]+b[p+1]*256+b[p+2]*65536;
function put24(b,p,n){b[p]=n&255;b[p+1]=(n>>>8)&255;b[p+2]=(n>>>16)&255;}
function animationInfo(bytes){
 const chunks=webpChunks(bytes),x=chunks.find(c=>c.name==='VP8X'),anim=chunks.filter(c=>c.name==='ANIM'),frames=chunks.filter(c=>c.name==='ANMF');
 if(!x||x.data.length!==10||!(x.data[0]&2)||anim.length!==1||!frames.length)throw Error('notAnimated');
 if(anim[0].data.length!==6)throw Error('invalid');
 const width=read24(x.data,4)+1,height=read24(x.data,7)+1;
 const durations=frames.map(f=>{
  if(f.data.length<24||read24(f.data,0)*2+read24(f.data,6)+1>width||read24(f.data,3)*2+read24(f.data,9)+1>height)throw Error('invalid');
  return read24(f.data,12);
 });
 return {width,height,durations,loop:anim[0].data[4]+anim[0].data[5]*256};
}
function riffChunk(name,data){
 const b=new Uint8Array(8+data.length+data.length%2);b.set([...name].map(c=>c.charCodeAt(0)));new DataView(b.buffer).setUint32(4,data.length,true);b.set(data,8);return b;
}
function animationFrame(still,width,height,duration){
 const chunks=webpChunks(still),image=chunks.filter(c=>['ALPH','VP8 ','VP8L'].includes(c.name));
 if(image.filter(c=>c.name==='VP8 '||c.name==='VP8L').length!==1)throw Error('encode');
 const data=new Uint8Array(16+image.reduce((n,c)=>n+c.raw.length,0));
 put24(data,6,width-1);put24(data,9,height-1);put24(data,12,duration);data[15]=2; // Full composited frame; replace, do not blend.
 let p=16;for(const c of image){data.set(c.raw,p);p+=c.raw.length;}
 const x=chunks.find(c=>c.name==='VP8X'),l=chunks.find(c=>c.name==='VP8L');
 return {chunk:riffChunk('ANMF',data),alpha:!!(x?.data[0]&16)||!!(l?.data[4]&16)||image.some(c=>c.name==='ALPH')};
}
function packAnimation(frames,width,height,loop){
 const x=new Uint8Array(10);x[0]=2|(frames.some(f=>f.alpha)?16:0);put24(x,4,width-1);put24(x,7,height-1);
 const anim=new Uint8Array(6);anim[4]=loop&255;anim[5]=loop>>>8;
 const chunks=[riffChunk('VP8X',x),riffChunk('ANIM',anim),...frames.map(f=>f.chunk)];
 const b=new Uint8Array(12+chunks.reduce((n,c)=>n+c.length,0));b.set([82,73,70,70,0,0,0,0,87,69,66,80]);new DataView(b.buffer).setUint32(4,b.length-8,true);
 let p=12;for(const c of chunks){b.set(c,p);p+=c.length;}return b;
}

const pixelCount=()=>[...pixels()].reduce((n,a)=>n+a.bitmap.width*a.bitmap.height,0);
function dispose(asset){if(![...frames,...layers].some(f=>f.asset===asset)){asset.bitmap.close();URL.revokeObjectURL(asset.url);}}
function invalidate(){if(resultUrl){URL.revokeObjectURL(resultUrl);resultUrl=null;$('status').textContent=t.newResult;}$('result').hidden=true;$('output').removeAttribute('src');$('save').removeAttribute('href');}
function stop(){clearTimeout(timer);playing=false;$('play').textContent=t.play;}
function changed(){stop();invalidate();draw();}
function paint(target,frame,width,height){
 const c=target.getContext('2d');target.width=width;target.height=height;c.clearRect(0,0,width,height);
 if(!$('transparent').checked){c.fillStyle=$('background').value;c.fillRect(0,0,width,height);}
 const W=+$('width').value,H=+$('height').value;c.save();c.scale(width/W,height/H);
 if(frame){const image=frame.asset.bitmap,s=Math.min(W/image.width,H/image.height);c.drawImage(image,(W-image.width*s)/2,(H-image.height*s)/2,image.width*s,image.height*s);}
 for(const l of layers){if(!l.visible)continue;c.globalAlpha=l.opacity/100;c.drawImage(l.asset.bitmap,l.x,l.y,l.w,l.h);}c.restore();c.globalAlpha=1;
}
function draw(){paint(canvas,frames[selected],+$('width').value,+$('height').value);$('summary').textContent=frames.length+' '+t.frames+' · '+(frames.reduce((n,f)=>n+f.ms,0)/1000).toFixed(2)+' s · '+canvas.width+' × '+canvas.height;}
function timeline(){const root=$('timeline');root.replaceChildren();frames.forEach((f,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-pressed',String(i===selected));b.title=f.asset.name;const img=document.createElement('img');img.src=f.asset.url;img.alt=f.asset.name;b.append(img,document.createTextNode((i+1)+' · '+f.ms+' ms'));b.onclick=()=>{stop();selected=i;sync();};root.append(b);});}
function sync(){selected=Math.max(0,Math.min(selected,frames.length-1));if(frames[selected])$('duration').value=frames[selected].ms;timeline();$('prev').disabled=!frames.length||selected===0;$('next').disabled=!frames.length||selected===frames.length-1;for(const id of ['duplicate','remove','play','apply','encode','fit'])$(id).disabled=!frames.length;$('duplicate').disabled=frames.length>=300||!frames.length;draw();}
function layerSync(){const list=$('overlay-list');list.replaceChildren();if(!layers.length){list.add(new Option(t.none,''));layerIndex=-1;}else layers.forEach((l,i)=>list.add(new Option((i+1)+'. '+l.asset.name,String(i))));$('overlay-settings').hidden=!layers.length;if(layerIndex>=0){list.value=layerIndex;const l=layers[layerIndex];for(const [id,key]of [['x','x'],['y','y'],['ow','w'],['oh','h'],['opacity','opacity']])$(id).value=l[key];$('visible').checked=l.visible;}$('up').disabled=layerIndex>=layers.length-1;$('down').disabled=layerIndex<=0;}
async function asset(file){
 if(file.size>30*1048576||!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error();
 const bytes=new Uint8Array(await file.arrayBuffer());
 if(file.type==='image/png'){const view=new DataView(bytes.buffer);for(let p=8;p+12<=bytes.length;){const n=view.getUint32(p),name=String.fromCharCode(...bytes.subarray(p+4,p+8));if(name==='acTL')throw Error();p+=12+n;}}
 if(file.type==='image/webp'&&webpChunks(bytes).some(c=>c.name==='ANIM'||c.name==='ANMF'))throw Error();
 const bitmap=await createImageBitmap(file);if(bitmap.width>8192||bitmap.height>8192||bitmap.width*bitmap.height>16000000||pixelCount()+bitmap.width*bitmap.height>64000000){bitmap.close();throw Error();}
 return {bitmap,url:URL.createObjectURL(file),name:file.name};
}
function lock(value,cancel=false){busy=value;$('edit').disabled=value;$('cancel').hidden=!cancel;$('progress').hidden=!cancel;}
async function add(files,overlay=false){if(busy)return;changed();lock(true);const skipped=[];
 try{for(const file of Array.from(files).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}))){let a;try{if(overlay?layers.length>=30:frames.length>=300)throw Error();a=await asset(file);if(overlay){const scale=Math.min(1,+$('width').value/a.bitmap.width,+$('height').value/a.bitmap.height);layers.push({asset:a,x:0,y:0,w:Math.max(1,Math.round(a.bitmap.width*scale)),h:Math.max(1,Math.round(a.bitmap.height*scale)),opacity:100,visible:true});layerIndex=layers.length-1;}else{if(!frames.length){const scale=Math.min(1,2048/Math.max(a.bitmap.width,a.bitmap.height));$('width').value=Math.max(1,Math.round(a.bitmap.width*scale));$('height').value=Math.max(1,Math.round(a.bitmap.height*scale));}frames.push({asset:a,ms:bound('duration',20,60000)});selected=frames.length-1;}}catch{if(a)dispose(a);skipped.push(file.name);} $('status').textContent=t.busy+' · '+(overlay?layers.length:frames.length);}}
 finally{lock(false);$('files').value='';$('overlay-files').value='';sync();layerSync();$('status').textContent=skipped.length?t.skipped+' '+skipped.join(', '):(lang==='ko'?'이미지를 추가했어요.':lang==='ja'?'画像を追加しました。':'Images added.');}
}
$('files').onchange=()=>add($('files').files);$('overlay-files').onchange=()=>add($('overlay-files').files,true);
for(const [id,offset]of [['prev',-1],['next',1]])$(id).onclick=()=>{const j=selected+offset;if(j<0||j>=frames.length)return;changed();[frames[selected],frames[j]]=[frames[j],frames[selected]];selected=j;sync();};
$('duplicate').onclick=()=>{if(frames.length>=300||!frames[selected])return;changed();frames.splice(selected+1,0,{...frames[selected]});selected++;sync();};
$('remove').onclick=()=>{if(!frames.length)return;changed();const [f]=frames.splice(selected,1);dispose(f.asset);sync();};
$('duration').onchange=()=>{const n=bound('duration',20,60000);if(frames[selected]){changed();frames[selected].ms=n;sync();}};
$('apply').onclick=()=>{changed();const n=bound('duration',20,60000);frames.forEach(f=>f.ms=n);sync();};
$('play').onclick=()=>{if(playing){stop();return;}if(!frames.length)return;playing=true;$('play').textContent=t.stop;selected=0;const tick=()=>{if(!playing)return;draw();$('timeline').querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===selected)));timer=setTimeout(()=>{if(selected===frames.length-1&&!$('loop').checked){stop();sync();return;}selected=(selected+1)%frames.length;tick();},frames[selected].ms);};tick();};
for(const id of ['width','height'])$(id).onchange=()=>{bound(id,1,4096);changed();};
for(const id of ['loop','transparent','background','quality'])$(id).onchange=()=>{if(id==='quality')bound(id,1,100);changed();};
$('overlay-list').onchange=()=>{layerIndex=+$('overlay-list').value;layerSync();};
for(const [id,key,min,max]of [['x','x',-16384,16384],['y','y',-16384,16384],['ow','w',1,16384],['oh','h',1,16384],['opacity','opacity',0,100]])$(id).onchange=()=>{if(!layers[layerIndex])return;layers[layerIndex][key]=bound(id,min,max);changed();};
$('visible').onchange=()=>{if(layers[layerIndex]){layers[layerIndex].visible=$('visible').checked;changed();}};
for(const [id,delta]of [['up',1],['down',-1]])$(id).onclick=()=>{const n=layerIndex+delta;if(n<0||n>=layers.length)return;[layers[layerIndex],layers[n]]=[layers[n],layers[layerIndex]];layerIndex=n;layerSync();changed();};
$('delete-overlay').onclick=()=>{if(layerIndex<0)return;const [l]=layers.splice(layerIndex,1);dispose(l.asset);layerIndex=layers.length-1;layerSync();changed();};
function point(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height};}
canvas.onpointerdown=e=>{if(busy||e.button!==0)return;const p=point(e);for(let i=layers.length-1;i>=0;i--){const l=layers[i];if(l.visible&&p.x>=l.x&&p.x<=l.x+l.w&&p.y>=l.y&&p.y<=l.y+l.h){changed();layerIndex=i;layerSync();drag={x:p.x-l.x,y:p.y-l.y};canvas.setPointerCapture(e.pointerId);e.preventDefault();break;}}};
canvas.onpointermove=e=>{if(!drag||busy)return;const p=point(e),l=layers[layerIndex];l.x=Math.max(-16384,Math.min(16384,Math.round(p.x-drag.x)));l.y=Math.max(-16384,Math.min(16384,Math.round(p.y-drag.y)));$('x').value=l.x;$('y').value=l.y;draw();};
for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,()=>drag=null);
function clear(){if(busy)return;stop();invalidate();const assets=pixels();frames=[];layers=[];for(const a of assets)dispose(a);selected=0;layerIndex=-1;sync();layerSync();$('status').textContent=t.empty;}
$('clear').onclick=clear;
$('cancel').onclick=()=>{token++;$('cancel').disabled=true;};
async function encode(fit){if(busy)return;if(!frames.length){$('status').textContent=t.noFrames;return;}changed();bound('quality',1,100);const id=++token;lock(true,true);$('cancel').disabled=false;$('progress').value=0;
 const W=+$('width').value,H=+$('height').value,q=+$('quality').value/100;
 const passes=fit?[[1,q],[1,q*.7],[1,q*.4],[.75,q*.6],[.5,q*.5],[.3,q*.45],[.15,q*.4],[Math.min(1,32/Math.max(W,H)),.2]]:[[1,q]];
 try{for(let pass=0;pass<passes.length;pass++){const [scale,quality]=passes[pass],w=Math.max(1,Math.round(W*scale)),h=Math.max(1,Math.round(H*scale)),output=document.createElement('canvas'),packed=[];let size=44,tooBig=false;
  try{for(let i=0;i<frames.length;i++){if(id!==token)throw Error('cancel');paint(output,frames[i],w,h);const blob=await new Promise(resolve=>output.toBlob(resolve,'image/webp',quality));if(id!==token)throw Error('cancel');if(!blob||blob.type!=='image/webp')throw Error();const f=animationFrame(new Uint8Array(await blob.arrayBuffer()),w,h,frames[i].ms);packed.push(f);size+=f.chunk.length;$('status').textContent=t.busy+' · '+(pass+1)+'/'+passes.length+' · '+(i+1)+'/'+frames.length+' · '+w+' × '+h;$('progress').value=(i+1)/frames.length*100;if(fit&&size>WEBP_TARGET){tooBig=true;break;}if(size>100*1048576)throw Error();}
   if(tooBig)continue;if(id!==token)throw Error('cancel');const bytes=packAnimation(packed,w,h,$('loop').checked?0:1),info=animationInfo(bytes);if(info.durations.length!==frames.length||info.durations.some((d,i)=>d!==frames[i].ms)||(fit&&bytes.length>WEBP_TARGET))throw Error();resultUrl=URL.createObjectURL(new Blob([bytes],{type:'image/webp'}));$('output').src=resultUrl;$('save').href=resultUrl;setName();$('output-info').textContent=w+' × '+h+' · '+(bytes.length/1000000).toFixed(2)+' MB ('+bytes.length.toLocaleString()+' B) · '+t.quality+' '+Math.round(quality*100);$('result').hidden=false;$('status').textContent=t.done;return;
  }finally{output.width=output.height=0;}
 }throw Error('fit');}catch(e){$('status').textContent=e.message==='cancel'?t.cancelled:e.message==='fit'?t.failed:t.error;}finally{lock(false);$('cancel').disabled=false;}
}
function setName(){const name=$('filename').value.replace(/[\\/:*?"<>|\u0000-\u001f]/g,'_').replace(/\.webp$/i,'').trim()||'FishAnimation';$('save').download=name+'.webp';}
$('filename').oninput=setName;$('encode').onclick=()=>encode(false);$('fit').onclick=()=>encode(true);
// Apply valid numeric edits immediately, including accessible/programmatic input events.
for(const el of document.querySelectorAll('input[type=number],input[type=color]'))el.addEventListener('input',()=>{if(el.value!==''&&el.checkValidity())el.onchange?.();});
window.addEventListener('pagehide',()=>{token++;stop();});sync();layerSync();
</script></body></html>
