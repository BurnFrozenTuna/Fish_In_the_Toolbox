function transferDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('fish-tool-transfer',1);r.onupgradeneeded=()=>r.result.createObjectStore('images');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function transferStore(value){const db=await transferDB(),id=crypto.randomUUID();try{await new Promise((resolve,reject)=>{const tx=db.transaction('images','readwrite'),s=tx.objectStore('images');s.clear();s.put({...value,time:Date.now()},id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);});return id;}finally{db.close();}}
async function transferTake(id){const db=await transferDB();try{return await new Promise((resolve,reject)=>{const tx=db.transaction('images','readwrite'),s=tx.objectStore('images'),r=s.get(id);let value;r.onsuccess=()=>{value=r.result;s.delete(id);};tx.oncomplete=()=>resolve(value&&Date.now()-value.time<3600000?value:null);tx.onerror=()=>reject(tx.error);});}finally{db.close();}}

// Pure mask operations; source RGB and source alpha remain untouched.
function colorMask(source,mask,w,h,x,y,tolerance,all){
 const start=y*w+x,p=start*4,target=source.slice(p,p+3),limit=tolerance*tolerance*3;
 const matches=i=>{const j=i*4;return (source[j]-target[0])**2+(source[j+1]-target[1])**2+(source[j+2]-target[2])**2<=limit;};
 if(all){for(let i=0;i<mask.length;i++)if(matches(i))mask[i]=0;return;}
 const seen=new Uint8Array(mask.length),queue=new Int32Array(mask.length);let head=0,tail=1;queue[0]=start;seen[start]=1;
 while(head<tail){const i=queue[head++];if(!matches(i))continue;mask[i]=0;const xx=i%w;for(const n of [xx?i-1:-1,xx<w-1?i+1:-1,i>=w?i-w:-1,i<w*(h-1)?i+w:-1])if(n>=0&&!seen[n]){seen[n]=1;queue[tail++]=n;}}
}
function brushMask(mask,w,h,a,b,radius,value){const steps=Math.max(1,Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/Math.max(1,radius/2)));for(let s=0;s<=steps;s++){const x=a.x+(b.x-a.x)*s/steps,y=a.y+(b.y-a.y)*s/steps;for(let yy=Math.max(0,Math.floor(y-radius));yy<=Math.min(h-1,Math.ceil(y+radius));yy++)for(let xx=Math.max(0,Math.floor(x-radius));xx<=Math.min(w-1,Math.ceil(x+radius));xx++)if((xx-x)**2+(yy-y)**2<=radius**2)mask[yy*w+xx]=value;}}
function polygonMask(mask,w,h,points,keep){for(let y=0;y<h;y++)for(let x=0;x<w;x++){let inside=false;for(let i=0,j=points.length-1;i<points.length;j=i++){const a=points[i],b=points[j];if((a.y>y+.5)!==(b.y>y+.5)&&(x+.5<(b.x-a.x)*(y+.5-a.y)/(b.y-a.y)+a.x))inside=!inside;}if(keep?!inside:inside)mask[y*w+x]=0;}}

const canvas=$('canvas'),ctx=canvas.getContext('2d'),overlay=$('overlay'),oc=overlay.getContext('2d');let original,mask,w=0,h=0,mode='color',history=[],future=[],points=[],drawing=false,last,name='image',generation=0,busy=false;
function snapshot(){history.push(mask.slice());if(history.length>8)history.shift();future=[];}

function drawPolygon(){oc.clearRect(0,0,w,h);if(!points.length)return;oc.strokeStyle='#ff5577';oc.fillStyle='#ff557733';oc.lineWidth=2/(canvas.getBoundingClientRect().width/w);oc.beginPath();points.forEach((p,i)=>i?oc.lineTo(p.x,p.y):oc.moveTo(p.x,p.y));if(points.length>2)oc.closePath();oc.stroke();oc.fill();for(const p of points){oc.beginPath();oc.fillStyle='#ff5577';oc.arc(p.x,p.y,3/(canvas.getBoundingClientRect().width/w),0,Math.PI*2);oc.fill();}}

$('file').addEventListener('change',async()=>{const file=$('file').files[0],id=++generation;if(!file)return;try{if(file.size>30*1048576||!/^image\/(png|jpeg|webp)$/.test(file.type))throw Error();const bytes=new Uint8Array(await file.arrayBuffer());if(file.type==='image/png'){for(let p=8;p+12<=bytes.length;){const v=new DataView(bytes.buffer),n=v.getUint32(p),type=String.fromCharCode(...bytes.subarray(p+4,p+8));if(type==='acTL')throw Error();p+=12+n;}}if(file.type==='image/webp'){for(let p=12;p+8<=bytes.length;){const v=new DataView(bytes.buffer),n=v.getUint32(p+4,true),type=String.fromCharCode(...bytes.subarray(p,p+4));if(type==='ANIM'||type==='ANMF')throw Error();p+=8+n+(n%2);}}const bitmap=await createImageBitmap(file);try{if(id!==generation)return;if(bitmap.width*bitmap.height>8000000||bitmap.width>16383||bitmap.height>16383)throw Error();w=bitmap.width;h=bitmap.height;canvas.width=overlay.width=w;canvas.height=overlay.height=h;ctx.clearRect(0,0,w,h);ctx.drawImage(bitmap,0,0);original=ctx.getImageData(0,0,w,h);mask=new Uint8Array(w*h).fill(255);history=[];future=[];points=[];drawing=false;name=file.name.replace(/\.[^.]+$/,'');$('editor').hidden=false;$('status').textContent=file.name+' · '+w+' × '+h;render();resize();}finally{bitmap.close();}}catch{$('status').textContent=t[27];}});
