const MAX_VIDEO_BYTES = 2_000_000_000;
function frameAt(time, count, hold, fade) {
  if (!count) return { index: -1, next: -1, blend: 0 };
  const step = Math.max(.1, hold), local = Math.max(0, time) % step;
  const index = Math.floor(Math.max(0, time) / step) % count;
  const duration = Math.min(Math.max(0, fade), step);
  const linear = duration ? Math.max(0, (local - (step - duration)) / duration) : 0;
  return { index, next: (index + 1) % count, blend: count > 1 ? linear * linear * (3 - 2 * linear) : 0 };
}

function visualizer(){
 if($('shape').value==='none')return;
 const w=canvas.width,h=canvas.height,x=w*num('vx')/100,y=h*num('vy')/100,scale=num('vsize')/100;

}
$('images').onchange=async e=>{halt();const files=[...e.target.files];$('controls').disabled=true;try{for(const file of files){if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error(t.imageError);const img=await createImageBitmap(file);if(img.width*img.height>32_000_000){img.close();throw Error(t.imageError);}const factor=Math.min(1,1920/img.width,1080/img.height);let stored=img;if(factor<1){stored=await createImageBitmap(img,{resizeWidth:Math.max(1,Math.round(img.width*factor)),resizeHeight:Math.max(1,Math.round(img.height*factor)),resizeQuality:'high'});img.close();}pictures.push({name:file.name,image:stored});}status(t.ready);}catch(err){status(err.message);}finally{$('controls').disabled=false;e.target.value='';list();draw();ready();}};
$('music').onchange=e=>{halt();const file=e.target.files[0];if(!file)return;if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(file);duration=0;audio.src=audioURL;$('audio-name').textContent=file.name;ready();};
audio.onloadedmetadata=()=>{duration=audio.duration;if(!Number.isFinite(duration)){status(t.audioError);return;}$('start').value=0;$('end').value=duration.toFixed(3);$('start').max=duration;$('end').max=duration;ready();draw();status(t.ready);};

async function audioSetup(){if(!ac){ac=new AudioContext();source=ac.createMediaElementSource(audio);analyser=ac.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.8;gain=ac.createGain();destination=ac.createMediaStreamDestination();source.connect(analyser);analyser.connect(gain);gain.connect(ac.destination);gain.connect(destination);bins=new Uint8Array(analyser.frequencyBinCount);}await ac.resume();gain.gain.value=num('volume')/100;}
function textList(){const sel=$('text-select');sel.replaceChildren();texts.forEach((v,i)=>{const opt=document.createElement('option');opt.value=i;opt.textContent=v.text.slice(0,24)||`${t.text} ${i+1}`;sel.append(opt);});sel.value=selected;$('text-fields').disabled=selected<0;if(selected>=0){const v=texts[selected];$('text').value=v.text;$('tx').value=v.x;$('ty').value=v.y;$('tsize').value=v.size;$('tcolor').value=v.color;}}
$('add-text').onclick=()=>{texts.push({text:t.sample,x:50,y:75,size:48,color:'#ffffff'});selected=texts.length-1;textList();draw();};
$('delete-text').onclick=()=>{texts.splice(selected,1);selected=texts.length-1;textList();draw();};
$('text-select').onchange=()=>{selected=num('text-select');textList();};
for(const id of ['text','tx','ty','tsize','tcolor'])$(id).addEventListener('input',()=>{if(selected<0)return;const v=texts[selected];Object.assign(v,{text:$('text').value,x:num('tx'),y:num('ty'),size:num('tsize'),color:$('tcolor').value});$('text-select').selectedOptions[0].textContent=v.text.slice(0,24)||t.text;draw();});
