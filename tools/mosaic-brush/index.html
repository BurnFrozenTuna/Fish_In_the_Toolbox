t[base+Math.min(length-1,k+radius+1)*step+c]-input[base+Math.max(0,k-radius)*step+c];}\n  }}\n }\n for(let k=0;k<3;k++){pass(a,b,true);pass(b,a,false);}\n const out=new Uint8ClampedArray(src);for(let i=0;i<n;i+=4){const alpha=a[i+3];out[i]=alpha?a[i]*255/alpha:0;out[i+1]=alpha?a[i+1]*255/alpha:0;out[i+2]=alpha?a[i+2]*255/alpha:0;}return out;\n}\nfunction paintSegment(dst,source,w,h,from,to,radius){\n const left=Math.max(0,Math.floor(Math.min(from.x,to.x)-radius)),right=Math.min(w-1,Math.ceil(Math.max(from.x,to.x)+radius));\n const top=Math.max(0,Math.floor(Math.min(from.y,to.y)-radius)),bottom=Math.min(h-1,Math.ceil(Math.max(from.y,to.y)+radius));\n const dx=to.x-from.x,dy=to.y-from.y,len=dx*dx+dy*dy,rr=radius*radius;\n for(let y=top;y<=bottom;y++)for(let x=left;x<=right;x++){const u=len?Math.max(0,Math.min(1,((x+.5-from.x)*dx+(y+.5-from.y)*dy)/len)):0,px=x+.5-from.x-u*dx,py=y+.5-from.y-u*dy;if(px*px+py*py>rr)continue;const i=(y*w+x)*4;dst[i]=source[i];dst[i+1]=source[i+1];dst[i+2]=source[i+2];dst[i+3]=source[i+3];}\n return {x:left,y:top,width:Math.max(0,right-left+1),height:Math.max(0,bottom-top+1)};\n}\n\nonmessage=e=>{const {data,w,h,mode,size}=e.data;const result=mode==='mosaic'?mosaicRGBA(data,w,h,size):blurRGBA(data,w,h,size);postMessage(result,[result.buffer]);};";
// RGB effects use premultiplied alpha; keep the source alpha at every pixel.
function brushWheelSize(size,delta){return Math.max(1,Math.min(1000,size+(delta===0?0:delta<0?1:-1)*Math.max(1,Math.round(size*.08))));}
function mosaicRGBA(src,w,h,size){
 const out=new Uint8ClampedArray(src);size=Math.max(2,Math.round(size));
 for(let y=0;y<h;y+=size)for(let x=0;x<w;x+=size){const right=Math.min(w,x+size),bottom=Math.min(h,y+size);let a=0,r=0,g=0,b=0;
  for(let yy=y;yy<bottom;yy++)for(let xx=x;xx<right;xx++){const i=(yy*w+xx)*4,v=src[i+3];a+=v;r+=src[i]*v;g+=src[i+1]*v;b+=src[i+2]*v;}
  for(let yy=y;yy<bottom;yy++)for(let xx=x;xx<right;xx++){const i=(yy*w+xx)*4;out[i]=a?r/a:0;out[i+1]=a?g/a:0;out[i+2]=a?b/a:0;}
 }return out;
}
function blurRGBA(src,w,h,radius){
 const n=w*h*4,a=new Float32Array(n),b=new Float32Array(n);radius=Math.max(1,Math.round(radius));
 for(let i=0;i<n;i+=4){a[i]=src[i]*src[i+3]/255;a[i+1]=src[i+1]*src[i+3]/255;a[i+2]=src[i+2]*src[i+3]/255;a[i+3]=src[i+3];}
 // Three separable box passes approximate a smooth Gaussian blur, with clamped edges.
 function pass(input,output,horizontal){const length=horizontal?w:h,lines=horizontal?h:w,step=horizontal?4:w*4,diameter=radius*2+1;
  for(let line=0;line<lines;line++){const base=horizontal?line*w*4:line*4;for(let c=0;c<4;c++){let sum=0;for(let k=-radius;k<=radius;k++)sum+=input[base+Math.max(0,Math.min(length-1,k))*step+c];

 for(let k=0;k<3;k++){pass(a,b,true);pass(b,a,false);}

}
function paintSegment(dst,source,w,h,from,to,radius){

 for(let y=top;y<=bottom;y++)for(let x=left;x<=right;x++){const u=len?Math.max(0,Math.min(1,((x+.5-from.x)*dx+(y+.5-from.y)*dy)/len)):0,px=x+.5-from.x-u*dx,py=y+.5-from.y-u*dy;if(px*px+py*py>rr)continue;const i=(y*w+x)*4;dst[i]=source[i];dst[i+1]=source[i+1];dst[i+2]=source[i+2];dst[i+3]=source[i+3];}

// Local same-origin handoff; blobs never leave the browser.
function transferDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('fish-tool-transfer',1);r.onupgradeneeded=()=>r.result.createObjectStore('images');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function transferStore(value){const db=await transferDB(),id=crypto.randomUUID();try{await new Promise((resolve,reject)=>{const tx=db.transaction('images','readwrite'),s=tx.objectStore('images');s.clear();s.put({...value,time:Date.now()},id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);});return id;}finally{db.close();}}
async function transferTake(id){const db=await transferDB();try{return await new Promise((resolve,reject)=>{const tx=db.transaction('images','readwrite'),s=tx.objectStore('images'),r=s.get(id);let value;r.onsuccess=()=>{value=r.result;s.delete(id);};tx.oncomplete=()=>resolve(value&&Date.now()-value.time<3600000?value:null);tx.onerror=()=>reject(tx.error);});}finally{db.close();}}

const requestLang=new URLSearchParams(location.search).get('lang'),lang=Object.hasOwn(dictionaries,requestLang)?requestLang:'ko',t=dictionaries[lang],$=id=>document.getElementById(id);

const canvas=$('canvas'),ctx=canvas.getContext('2d'),cursor=$('cursor'),cc=cursor.getContext('2d');let original=null,current=null,effect=null,w=0,h=0,mode='mosaic',drawing=false,last=null,undo=[],redo=[],worker=null,generation=0,loadGeneration=0,loading=false,exporting=false,name='image',cursorPoint=null,filterTimer=null;

function message(text){$('status').textContent=text;}
function updateButtons(){for(const id of controls)$(id).disabled=loading||exporting;$('undo').disabled=loading||exporting||drawing||!undo.length;$('redo').disabled=loading||exporting||drawing||!redo.length;$('reset').disabled=loading||exporting||drawing||!original;$('save').disabled=$('send').disabled=loading||exporting||drawing||!original;}

function stopWorker(){clearTimeout(filterTimer);generation++;if(worker){worker.terminate();worker=null;}}
function prepare(){stopWorker();effect=null;if(!original)return;if(mode==='restore'){effect=original.data;message(t.ready);return;}
 message(t.preparing);const id=generation;filterTimer=setTimeout(()=>{if(id!==generation)return;try{const url=URL.createObjectURL(new Blob([workerCode],{type:'text/javascript'}));worker=new Worker(url);URL.revokeObjectURL(url);const copy=original.data.slice();worker.onmessage=e=>{if(id!==generation)return;effect=e.data;worker.terminate();worker=null;message(t.ready);};worker.onerror=()=>{if(id!==generation)return;stopWorker();message(t.error);};worker.postMessage({data:copy,w,h,mode,size:mode==='mosaic'?+$('grain').value:+$('strength').value},[copy.buffer]);}catch{stopWorker();message(t.error);}},100);
}
function finish(){if(!drawing)return;drawing=false;last=null;updateButtons();}

for(const id of ['mosaic','blur','restore'])$(id).onclick=()=>{finish();mode=id;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.id===mode)));prepare();};
function numeric(id,min,max,value){const n=Math.max(min,Math.min(max,Math.round(Number(value)||min)));$(id).value=$(id+'-range').value=n;if(id==='brush')drawCursor();else if((id==='grain'&&mode==='mosaic')||(id==='strength'&&mode==='blur')){finish();prepare();}}
for(const [id,min,max]of [['brush',1,1000],['grain',2,200],['strength',1,80]]){for(const input of [$(id),$(id+'-range')]){input.addEventListener('input',()=>{if(input.value!==''&&input.checkValidity())numeric(id,min,max,input.value);});input.addEventListener('change',()=>numeric(id,min,max,input.value));}}
$('viewport').addEventListener('wheel',e=>{if(!e.altKey||!original||loading||exporting)return;e.preventDefault();numeric('brush',1,1000,brushWheelSize(+$('brush').value,e.deltaY));},{passive:false});
$('zoom').onchange=()=>{finish();resize();};window.addEventListener('resize',resize);
$('undo').onclick=()=>{finish();if(!undo.length)return;redo.push(current.data);current=new ImageData(undo.pop(),w,h);render();};

async function select(files){if(exporting||!files.length)return;if(files.length!==1){message(t.one);return;}const file=files[0],id=++loadGeneration;finish();loading=true;updateButtons();let bitmap;
 try{if(file.size>30*1048576||!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error();const bytes=new Uint8Array(await file.arrayBuffer());

 stopWorker();w=bitmap.width;h=bitmap.height;canvas.width=cursor.width=w;canvas.height=cursor.height=h;ctx.clearRect(0,0,w,h);ctx.drawImage(bitmap,0,0);original=ctx.getImageData(0,0,w,h);current=new ImageData(original.data.slice(),w,h);undo=[];redo=[];cursorPoint=null;name=file.name.replace(/\.[^.]+$/,'');$('editor').hidden=false;$('image-info').textContent=file.name+' · '+w+' × '+h;render();resize();prepare();
 }catch{if(id===loadGeneration)message(t.error);}finally{bitmap?.close();if(id===loadGeneration){loading=false;$('file').value='';updateButtons();}}
}
$('file').onchange=()=>select(Array.from($('file').files));$('drop').ondragover=e=>e.preventDefault();$('drop').ondrop=e=>{e.preventDefault();select(Array.from(e.dataTransfer.files));};window.addEventListener('dragover',e=>e.preventDefault());window.addEventListener('drop',e=>e.preventDefault());

async function exportImage(send){if(!current||loading||exporting)return;finish();exporting=true;updateButtons();try{const type=send?'image/png':$('format').value,blob=await new Promise(resolve=>canvas.toBlob(resolve,type,+$('quality').value/100));if(!blob||blob.type!==type)throw Error();
