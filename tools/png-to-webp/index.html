function assertOpaqueWebp(bytes){
 const view=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
 for(let pos=12;pos<bytes.length;){
  const name=String.fromCharCode(...bytes.subarray(pos,pos+4)),size=view.getUint32(pos+4,true);
  if(name==='ALPH'||(name==='VP8X'&&(bytes[pos+8]&0x10))||(name==='VP8L'&&(bytes[pos+12]&0x10)))throw Error('encode');
  pos+=8+size+(size%2);
 }
}
function inspectPng(bytes) {
  const fail = () => { throw new Error('invalid'); };
  if (bytes.length < 33 || ![137,80,78,71,13,10,26,10].every((v,i)=>bytes[i]===v)) fail();
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let pos=8, width=0, height=0, end=false, data=false;
  while (pos < bytes.length) {
    if(pos+12>bytes.length) fail();
    const size=view.getUint32(pos), name=String.fromCharCode(...bytes.subarray(pos+4,pos+8));
    if(pos+12+size>bytes.length) fail();
    if(pos===8 && (name!=='IHDR'||size!==13)) fail();
    if(name==='IHDR') { if(width||size!==13) fail(); width=view.getUint32(pos+8); height=view.getUint32(pos+12); }
    if(name==='acTL') throw new Error('animated');
    if(name==='IDAT') data=true;
    pos+=size+12;
    if(name==='IEND') { if(size!==0) fail(); end=true; break; }
  }
  if(!end||!data||!width||!height) fail();
  if(width>16383||height>16383||width*height>24000000) throw new Error('large');
  return {width,height};
}

function cleanWebp(bytes) {
  const text=(a,b)=>String.fromCharCode(...bytes.subarray(a,b));
  const fail=()=>{throw new Error('encode');};
  if(bytes.length<20||text(0,4)!=='RIFF'||text(8,12)!=='WEBP') fail();
  const view=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
  const end=view.getUint32(4,true)+8;
  if(end!==bytes.length) fail();
  const keep=[]; let pos=12, frames=0;
  while(pos<end) {
    if(pos+8>end) fail();
    const name=text(pos,pos+4),size=view.getUint32(pos+4,true),next=pos+8+size+(size%2);
    if(next>end) fail();
    if(name==='ANIM'||name==='ANMF') fail();
    if(['VP8X','ALPH','VP8 ','VP8L'].includes(name)) {
      const chunk=bytes.slice(pos,next);
      if(name==='VP8X') { if(size!==10||(chunk[8]&2)) fail(); chunk[8]&=0x10; chunk.fill(0,9,12); }
      if(name==='VP8 '||name==='VP8L') frames++;
      if(size%2)chunk[chunk.length-1]=0;
      keep.push(chunk);
    }
    pos=next;
  }
  if(frames!==1)fail();
  const result=new Uint8Array(12+keep.reduce((sum,c)=>sum+c.length,0));
  result.set([82,73,70,70,0,0,0,0,87,69,66,80]);
  new DataView(result.buffer).setUint32(4,result.length-8,true);
  pos=12; for(const chunk of keep){result.set(chunk,pos);pos+=chunk.length;}
  return result;
}

// ZIP STORE: WebP is already compressed. UTF-8 names, per-entry CRC32, no external library.
const crcTable=Uint32Array.from({length:256},(_,i)=>{let c=i;for(let n=0;n<8;n++)c=(c&1)?0xedb88320^(c>>>1):c>>>1;return c>>>0;});
function crc32(bytes){let c=0xffffffff;for(const b of bytes)c=crcTable[(c^b)&255]^(c>>>8);return (c^0xffffffff)>>>0;}
class StoreZip {
 constructor(){this.entries=[];this.length=0;}
 add(name,bytes){
  const encoded=new TextEncoder().encode(name);
  if(encoded.length>65535||bytes.length>0xffffffff||this.entries.length>=65535)throw Error('zip');
  const header=new Uint8Array(30+encoded.length),view=new DataView(header.buffer),crc=crc32(bytes);
  view.setUint32(0,0x04034b50,true);view.setUint16(4,20,true);view.setUint16(6,0x800,true);view.setUint16(12,33,true);
  view.setUint32(14,crc,true);view.setUint32(18,bytes.length,true);view.setUint32(22,bytes.length,true);view.setUint16(26,encoded.length,true);header.set(encoded,30);
  this.entries.push({encoded,header,bytes,crc,offset:this.length});this.length+=header.length+bytes.length;
 }
 finish(){
  const chunks=[],directory=[];let directorySize=0;
  for(const e of this.entries){
   chunks.push(e.header,e.bytes);const h=new Uint8Array(46+e.encoded.length),v=new DataView(h.buffer);
   v.setUint32(0,0x02014b50,true);v.setUint16(4,20,true);v.setUint16(6,20,true);v.setUint16(8,0x800,true);v.setUint16(14,33,true);
   v.setUint32(16,e.crc,true);v.setUint32(20,e.bytes.length,true);v.setUint32(24,e.bytes.length,true);v.setUint16(28,e.encoded.length,true);v.setUint32(42,e.offset,true);h.set(e.encoded,46);directory.push(h);directorySize+=h.length;
  }
  const end=new Uint8Array(22),v=new DataView(end.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,this.entries.length,true);v.setUint16(10,this.entries.length,true);v.setUint32(12,directorySize,true);v.setUint32(16,this.length,true);
  return new Blob([...chunks,...directory,end],{type:'application/zip'});
 }
}

 const reasons={ko:'왜 제거하나요? NovelAI 등 일부 생성 도구는 프롬프트·생성 설정을 알파 채널(투명도)에 저장하기도 해요. 일반 메타데이터만 지우면 이 정보가 남을 수 있어, 공유 전에 알파 채널도 제거하는 옵션입니다.',en:'Why remove it? Some generators, including NovelAI, can store prompts and generation settings in the alpha (transparency) channel. Removing ordinary metadata may leave this information behind; this option removes the alpha channel before sharing.',ja:'なぜ削除するの？ NovelAIなど一部の生成ツールは、プロンプトや生成設定をアルファチャンネル（透明度）にも保存します。通常のメタデータを削除するだけでは残る場合があるため、共有前にアルファチャンネルも除去するためのオプションです。'};

function inspectPng(bytes) {

function cleanWebp(bytes) {
