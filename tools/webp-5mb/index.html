function webpChunks(bytes) {
 const text=(p,n)=>String.fromCharCode(...bytes.subarray(p,p+n));
 const view=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
 if(bytes.length<12||text(0,4)!=='RIFF'||text(8,4)!=='WEBP'||view.getUint32(4,true)+8!==bytes.length)throw Error('invalid');
 const result=[];let p=12;
 while(p<bytes.length){
  if(p+8>bytes.length)throw Error('invalid');
  const size=view.getUint32(p+4,true),end=p+8+size+(size%2);
  if(end>bytes.length)throw Error('invalid');
  result.push({name:text(p,4),data:bytes.subarray(p+8,p+8+size),raw:bytes.subarray(p,end)});p=end;
 }
 return result;
}
const read24=(b,p)=>b[p]+b[p+1]*256+b[p+2]*65536;
function put24(b,p,n){b[p]=n&255;b[p+1]=(n>>>8)&255;b[p+2]=(n>>>16)&255;}
function animationInfo(bytes){
 const chunks=webpChunks(bytes),x=chunks.find(c=>c.name==='VP8X'),anim=chunks.filter(c=>c.name==='ANIM'),frames=chunks.filter(c=>c.name==='ANMF');
 if(!x||x.data.length!==10||!(x.data[0]&2)||anim.length!==1||!frames.length)throw Error('notAnimated');
 if(anim[0].data.length!==6)throw Error('invalid');
 const width=read24(x.data,4)+1,height=read24(x.data,7)+1;
 const durations=frames.map(f=>{
  if(f.data.length<24||read24(f.data,0)*2+read24(f.data,6)+1>width||read24(f.data,3)*2+read24(f.data,9)+1>height)throw Error('invalid');
  return read24(f.data,12);
 });
 return {width,height,durations,loop:anim[0].data[4]+anim[0].data[5]*256};
}
function riffChunk(name,data){

}
function animationFrame(still,width,height,duration){
 const chunks=webpChunks(still),image=chunks.filter(c=>['ALPH','VP8 ','VP8L'].includes(c.name));
 if(image.filter(c=>c.name==='VP8 '||c.name==='VP8L').length!==1)throw Error('encode');

 let p=16;for(const c of image){data.set(c.raw,p);p+=c.raw.length;}

}
function packAnimation(frames,width,height,loop){

}
